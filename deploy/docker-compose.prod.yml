services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: django_web

    command:
      - gunicorn
      - resume_project.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "120"

    expose:
      - "8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    restart: unless-stopped

    networks:
      - resume_network


  caddy:
    image: caddy:2-alpine

    container_name: resume_caddy

    restart: unless-stopped

    depends_on:
      - web

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}

    volumes:
      - caddy_data:/data
      - caddy_config:/config

      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro

    networks:
      - resume_network


networks:

  resume_network:


volumes:

  static_volume:

  media_volume:

  caddy_data:

  caddy_config: