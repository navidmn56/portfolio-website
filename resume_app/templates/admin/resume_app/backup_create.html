{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <form method="post" id="backup_form">
        {% csrf_token %}
        
        <div>
            <fieldset class="module aligned">
                <h2>Create SQLite Backup</h2>
                
                <div class="form-row">
                    <div>
                        <label for="id_description">Description:</label>
                        {{ form.description }}
                        <p class="help">Optional description for this backup</p>
                    </div>
                </div>
                
                <div class="form-row" style="background: #f8f9fa; padding: 15px; border-radius: 4px; margin-top: 10px;">
                    <p style="margin: 0; color: #0a2c3e;">
                        <strong>ℹ️ Info:</strong> A complete copy of your <code>db.sqlite3</code> file will be created.
                    </p>
                </div>
            </fieldset>
            
            <div class="submit-row">
                <input type="submit" value="Create Backup" class="default" name="_save">
                <a href="{% url 'admin:resume_app_backup_changelist' %}" class="button">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
