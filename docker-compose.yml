services:
  web:
    build: .
    container_name: django_web
    command: gunicorn resume_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    restart: unless-stopped

    env_file:
      - .env

volumes:
  static_volume:
  media_volume: